version: 2
project_name: gopdfid

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/gopdfid
    binary: gopdfid
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  github:
    owner: drummonds
    name: gopdfid
